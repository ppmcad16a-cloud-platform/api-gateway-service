# ============================================================
# API Gateway Service CI
#
# This file is intentionally tiny. The real pipeline lives in
# ppmcad16a-cloud-platform/core-cloud-platform and is shared
# by every service, so all services follow the same standards.
#
# @v2 = tested release of the shared workflows (see the
#       "Versioning" section of the core-cloud-platform README).
# ============================================================

name: API Gateway Service CI

on:
  push:
    branches:
      - main
  pull_request:

# A newer push to the same branch/PR cancels the older run
# (saves CI minutes, gives faster feedback).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for every job below.
permissions:
  contents: read

jobs:

  # Build, test (coverage gate) and - if enabled - build + scan
  # the container image.
  build:
    permissions:
      contents: read
      id-token: write # the image job logs in to the clouds (main branch only)
    uses: ppmcad16a-cloud-platform/core-cloud-platform/.github/workflows/node-app.yaml@v2
    with:
      node-version: "22"
      build-docker: true
      image-name: api-gateway-service
      push-images: true
      deploy-after-push: true

  # Scan the whole git history for leaked secrets.
  secret-scan:
    uses: ppmcad16a-cloud-platform/core-cloud-platform/.github/workflows/security-scan.yaml@v2
